

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Friend - Phonics Adventure</title>

<style>
body {
font-family: Arial;
background: #FFF7ED;
margin: 0;
padding: 10px;
text-align: center;
color: #30234A;
}
h1 {color:#7C3AED;font-size:36px}
.card {
background:white;
border-radius:24px;
padding:16px;
margin:16px auto;
max-width:800px;
box-shadow:0 6px 18px #0002;
border:3px solid #FDE68A;
}
button {
background:#7C3AED;
color:white;
border:0;
padding:10px 16px;
border-radius:20px;
font-size:17px;
margin:5px;
cursor:pointer;
}
button.green {background:#16A34A}
button.gold {background:#F59E0B}
.dino {
font-size:90px;
animation:walk 2s infinite alternate;
}
@keyframes walk {
from {transform:translateX(-15px)}
to {transform:translateX(15px)}
}
.word {
display:inline-block;
background:#F3E8FF;
padding:12px;
border-radius:14px;
margin:5px;
min-width:95px;
font-size:18px;
}
.sentence {
background:#FEF3C7;
padding:12px;
border-radius:12px;
margin:8px;
}
.vowels {
display:flex;
justify-content:center;
flex-wrap:wrap;
}
.vowel {
width:60px;
height:60px;
line-height:60px;
border-radius:50%;
color:white;
font-size:30px;
font-weight:bold;
margin:5px;
}
.a{background:#EF4444}
.e{background:#F97316}
.i{background:#EAB308}
.o{background:#22C55E}
.u{background:#3B82F6}
</style>
</head>

<body>

<div class="dino">🦖</div>
<h1>Dino Friend</h1>
<h2>Phonics Reading Adventure</h2>

<p>⭐ Your Stars: <span id="stars">0</span></p>

<button class="green" onclick="speak('Hello! I am Dino! Let us learn phonics!')">
🦖 Dino Says Hello!
</button>

<div class="card">
<h2>🔊 Speaking Speed</h2>
<select id="speed" onchange="rate=Number(this.value)">
<option value="0.55">Very Slow</option>
<option value="0.65" selected>Slow</option>
<option value="0.8">Normal</option>
<option value="1">Fast</option>
</select>
<button onclick="speak('The cat sat on the mat.')">Test Voice</button>
</div>

<div class="card">
<h2>🌈 Meet the Vowels</h2>
<p>Tap a letter and listen!</p>
<div class="vowels">
<span class="vowel a" onclick="speak('A')">A</span>
<span class="vowel e" onclick="speak('E')">E</span>
<span class="vowel i" onclick="speak('I')">I</span>
<span class="vowel o" onclick="speak('O')">O</span>
<span class="vowel u" onclick="speak('U')">U</span>
</div>
</div>

<div id="lessons"></div>

<div class="card">
<h2>🏆 Big Challenge</h2>
<p id="challengeQuestion">Listen and choose!</p>
<div id="challengeButtons"></div>
<button onclick="startChallenge()">Start Challenge</button>
<p id="challengeResult"></p>
</div>

<div class="card">
<h2>🎮 Dino Listening Game</h2>
<p id="question">Press Start Game!</p>
<div id="answers"></div>
<button onclick="startQuiz()">Start Game</button>
<button onclick="repeatQuiz()">🔊 Hear Again</button>
<p id="result"></p>
</div>

<div class="card">
<h2>🃏 Dino Flashcards</h2>
<h1 id="flashEmoji">🐱</h1>
<h2 id="flashWord">cat</h2>
<button onclick="nextFlash()">New Card</button>
<button class="green" onclick="speak(flashWord.textContent)">🔊 Listen</button>
<button class="gold" onclick="addStar()">⭐ I Know It!</button>
</div>

<script>

let rate=0.65;
let stars=0;
let allWords=[];
let currentWord="";
let flashIndex=0;

function speak(text){
if(!window.speechSynthesis)return;
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(text);
u.lang="en-US";
u.rate=rate;
u.pitch=1;
speechSynthesis.speak(u);
}

function addStar(){
stars++;
document.getElementById("stars").innerText=stars;
}

const lessons=[

},

function renderLessons(){

let container=document.getElementById("lessons");

lessons.forEach((lesson,index)=>{

let card=document.createElement("div");
card.className="card";

let html="<h2>🔤 "+lesson.title+"</h2>";
html+="<p>Listen and Repeat!</p>";

lesson.words.split(" ").forEach(word=>{

allWords.push(word);

html+=`
<div class="word">
<b>${word}</b><br>
<button onclick="speak('${word}')">🔊 Listen</button>
</div>`;

});

html+="<h3>📖 Five Sentences</h3>";

lesson.sentences.forEach((sentence,i)=>{

html+=`
<div class="sentence">
${i+1}. ${sentence}
<button onclick="speak('${sentence}')">🔊</button>
</div>`;

});

html+=`
<button class="green" onclick="readAll(${index})">
🔊 Listen to All Sentences
</button>`;

card.innerHTML=html;
container.appendChild(card);

});

}

function readAll(index){
let sentences=lessons[index].sentences;
let i=0;
function next(){
if(i<sentences.length){
let sentence=sentences[i++];
speak(sentence);
setTimeout(next,Math.max(2500,sentence.length*120));
}
}
next();
}

function startQuiz(){

currentWord=allWords[Math.floor(Math.random()*allWords.length)];

let options=[currentWord];

while(options.length<3){
let w=allWords[Math.floor(Math.random()*allWords.length)];
if(!options.includes(w))options.push(w);
}

options.sort(()=>Math.random()-.5);

document.getElementById("question").innerText=
"Listen! What did Dino say?";

let box=document.getElementById("answers");
box.innerHTML="";

options.forEach(word=>{
let b=document.createElement("button");
b.innerText=word;
b.onclick=()=>{
if(word===currentWord){
document.getElementById("result").innerText="Correct! Great job! ⭐";
addStar();
speak("Correct! Great job!");
}else{
document.getElementById("result").innerText="Try again!";
speak(currentWord);
}
};
box.appendChild(b);
});

document.getElementById("result").innerText="";
speak(currentWord);
}

function repeatQuiz(){
if(currentWord)speak(currentWord);
}

const challengePairs=[
["cat","cake"],["hat","name"],["tap","tape"],
["pin","pine"],["kit","kite"],["bit","bite"],
["hop","hope"],["not","note"],["mop","mope"],
["cub","cube"],["cut","cute"],["tub","tube"]
];

let challengeWord="";

function startChallenge(){

let pair=challengePairs[Math.floor(Math.random()*challengePairs.length)];
challengeWord=pair[Math.floor(Math.random()*2)];

let options=[...pair];
options.sort(()=>Math.random()-.5);

document.getElementById("challengeQuestion").innerText=
"Listen carefully. Which word did Dino say?";

let box=document.getElementById("challengeButtons");
box.innerHTML="";

options.forEach(word=>{
let b=document.createElement("button");
b.innerText=word;
b.onclick=()=>{
if(word===challengeWord){
document.getElementById("challengeResult").innerText=
"Amazing! Correct! ⭐";
addStar();
speak("Amazing! Correct!");
}else{
document.getElementById("challengeResult").innerText=
"Try again!";
speak(challengeWord);
}
};
box.appendChild(b);
});

speak(challengeWord);
}

function nextFlash(){
flashIndex=(flashIndex+1)%allWords.length;
let word=allWords[flashIndex];
document.getElementById("flashWord").innerText=word;
speak(word);
}

renderLessons();

</script>
