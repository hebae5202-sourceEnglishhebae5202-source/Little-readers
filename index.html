<style>
*{box-sizing:border-box;font-family:'Comic Sans MS',Arial,sans-serif}
body{margin:0;background:linear-gradient(#FFE9F5,#FFF7E6,#D9F0FF);text-align:center;padding:14px;overflow-x:hidden}
h1{font-size:36px;color:#FF4D8D;animation:bounce 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.card{border-radius:28px;padding:22px;margin:16px auto;max-width:580px;box-shadow:0 10px 22px rgba(0,0,0,.12);border:4px solid white;animation:pop .5s}
.pink{background:#FFE3EE}.blue{background:#D9F0FF}.yellow{background:#FFF3C4}.green{background:#DFF7D8}.purple{background:#EAD9FF}.orange{background:#FFE5CC}
.vowel-box{display:inline-block;width:64px;height:64px;line-height:64px;border-radius:50%;font-size:32px;font-weight:bold;color:#fff;margin:5px;border:3px solid white;animation:wiggle 1.2s infinite}
.a{background:#FF4D6D}.e{background:#FF9F1C}.i{background:#4361EE}.o{background:#2EC4B6}.u{background:#9B5DE5}
.big{font-size:90px;animation:bounce 1.2s infinite}
