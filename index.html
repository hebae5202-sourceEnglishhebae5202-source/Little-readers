function clean(t){return t.replace(/[^a-zA-Z0-9 .,!?']/g,' ')}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(clean(t));u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}

function addStar(){stars++;document.getElementById('stars').innerText=stars;alert('Great! Dino is happy! You got a star!')}
function hearAgain(){if(cur){speak(cur)}}
